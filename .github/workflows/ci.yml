name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` on purpose. action-setup@v4 throws "Multiple versions of
      # pnpm specified" when its input disagrees with package.json's
      # packageManager pin, and "9" !== "9.15.4". Reading the pin is also the
      # behaviour we want: CI resolves the exact pnpm the lockfile was written
      # with, and there is one place to bump it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # Catches env-parse regressions. Values are throwaway: nothing here
      # connects to a real service. The build output is captured so the next
      # step can enforce the bundle budget against Next's own figures.
      - name: Build web
        working-directory: apps/web
        env:
          DATABASE_URL: postgres://quorum:quorum@localhost:5432/quorum
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: Y2ktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1zZWNyZXQ=
          CREDENTIALS_ENCRYPTION_KEY: Y2ktcGxhY2Vob2xkZXItbm90LWEtcmVhbC1zZWNyZXQ=
          NEXT_PUBLIC_WS_URL: ws://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        # `shell: bash` is load-bearing: it runs with `-eo pipefail`, so a failed
        # build still fails the step. The default shell would report tee's exit
        # code and let a broken build through.
        shell: bash
        run: pnpm build | tee build.log

      # The 250KB gzipped initial-JS budget (CLAUDE.md §1). Previously the
      # comment above claimed the build enforced this; nothing did.
      - name: Check bundle budget
        working-directory: apps/web
        run: node scripts/check-bundle-budget.mjs build.log
